name: Create GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release ${{ github.ref_name }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          git fetch --no-tags origin "$GITHUB_REF"
          tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD

          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          changelog_version=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$changelog_version" != "$version" ]]; then
            echo '::error::Tag, pubspec version, and first changelog version must match.'
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
