name: native_connectivity_example
description: Try native network monitoring and HTTP response recovery with Dio and package:http.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  http: ^1.6.0
  native_connectivity:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
